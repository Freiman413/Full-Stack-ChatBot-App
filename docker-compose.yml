version: "3.8"

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=super-secret-key-change-me
      - OLLAMA_MODEL=qwen2.5:3b
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

  frontend:
    build: ./chatbot-frontend
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  mongo_data: